<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Revestimentos</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <h1>Visualizador de Revestimentos</h1>
    <p>Envie uma foto do ambiente e veja como fica com um revestimento do catálogo.</p>
  </header>

  <main class="container">
    <section id="upload-section" class="panel">
      <label for="photo-input" class="upload-box" id="upload-box">
        <span id="upload-label">Clique ou arraste uma foto do ambiente aqui</span>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </label>
    </section>

    <section id="canvas-section" class="panel hidden">
      <p class="instructions" id="instructions">Marque os 4 cantos da parede ou piso que você quer revestir, na ordem: superior-esquerdo, superior-direito, inferior-direito, inferior-esquerdo.</p>
      <canvas id="photo-canvas"></canvas>
      <div class="actions">
        <button id="reset-points-btn" type="button">Refazer marcação</button>
        <button id="new-photo-btn" type="button">Trocar foto</button>
      </div>

      <div id="catalog-section" class="catalog hidden">
        <p class="instructions">Escolha um revestimento:</p>
        <div class="catalog-grid">
          <button class="catalog-item" data-texture="./assets/catalogo/brick-mescla-prime.jpg" type="button">
            <img src="./assets/catalogo/brick-mescla-prime.jpg" alt="Brick Mescla Prime">
            <span>Brick Mescla Prime</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="window.__cvReady = true"></script>
  <script src="./app.js"></script>
</body>
</html>
