name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultâneos brigando pelo mesmo ambiente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta que contém o site pronto (frontend/, não a raiz do repo)
          path: ./frontend

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
